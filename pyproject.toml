[project]
name = "devday-workshop-ai-assisted-development"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit>=1.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.1",
    "prek>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devday_workshop_ai_assisted_development"]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 100

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-simplify
    "SIM",
    # pyupgrade
    "UP",
]
ignore = ["D104"]
exclude = ["*.ipynb"]

# Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104", "E402"]
"**/{tests,docs,tools}/*" = ["D", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
addopts = ["-v", "--tb=short", "--cov=src", "--cov-report=term"]
testpaths = ["tests"]
